      --text: #475569;

    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.06);
      padding: 30px 22px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .badge-top {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--gold-dark);
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .subtitulo {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      font-size: 0.95rem;
      color: var(--primary);
      background-color: #fafaf9;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus {
      border-color: var(--gold);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(179, 139, 77, 0.15);
    }

    .badge-cat {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      margin: 16px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-pinza { background: #fef3c7; color: #92400e; }
    .badge-video { background: #e0f2fe; color: #075985; }
    .badge-vip { background: #dcfce7; color: #166534; }
    .badge-infantil { background: #fee2e2; color: #991b1b; }

    .reto-result {
      display: none;
      margin-top: 18px;
      padding: 22px 18px;
      background: var(--gold-soft);
      border-radius: 16px;
      border: 1.5px dashed var(--gold);
      animation: fadeIn 0.35s ease;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reto-nombre-invitado {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #78716c;
      margin-bottom: 4px;

    const catPillEl = document.getElementById('cat-pill');
    const retoBox = document.getElementById('reto-box');
    const retoNombre = document.getElementById('reto-nombre');
    const retoTitulo = document.getElementById('reto-titulo');
    const retoCuerpo = document.getElementById('reto-cuerpo');

    // Cargar las 23 mesas en el primer selector
    Object.keys(datosMesas).forEach((id) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = datosMesas[id].etiqueta;
      mesaSelect.appendChild(opt);
    });

    // Evento al seleccionar mesa
    mesaSelect.addEventListener('change', (e) => {
      const mesaId = e.target.value;
      retoBox.style.display = 'none';
      personaSelect.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';

      if (mesaId && datosMesas[mesaId]) {
        const mesa = datosMesas[mesaId];

        // Inserta distintivo de categoría
        catPillEl.innerHTML = `<span class="badge-cat badge-${mesa.tipo}">${mesa.categoria}</span>`;

        // Llenar nombres de los invitados de esa mesa
        mesa.personas.forEach((p, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = p.nombre;
          personaSelect.appendChild(opt);
        });

        personaWrapper.style.display = 'block';
      } else {
        personaWrapper.style.display = 'none';
        catPillEl.innerHTML = '';
      }
    });

    // Evento al seleccionar persona
    personaSelect.addEventListener('change', (e) => {
      const mesaId = mesaSelect.value;
      const personaIdx = e.target.value;

      if (mesaId && personaIdx !== "") {
        const persona = datosMesas[mesaId].personas[personaIdx];
        retoNombre.textContent = persona.nombre;
        retoTitulo.textContent = persona.titulo;
        retoCuerpo.textContent = persona.reto;
        retoBox.style.display = 'block';
      } else {
        retoBox.style.display = 'none';
      }
    });
